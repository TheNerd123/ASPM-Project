<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Management | ASPM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="users" data-title="User Management">
  <main id="content">
    <div class="page-head">
      <div>
        <h1>User Management</h1>
        <p class="muted">Manage platform users and their roles.</p>
      </div>
    </div>

    
<div class="card">
  <h2>Platform Users</h2>
  <p class="muted">Sample users for interface development.</p>

  <input
    type="search"
    id="user-search"
    placeholder="Search users by name or email..."
    aria-label="Search users"
  >

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Alice Johnson</td>
        <td>alice@example.com</td>
        <td>Admin</td>
        <td>Active</td>
      </tr>

      <tr>
        <td>Bob Smith</td>
        <td>bob@example.com</td>
        <td>User</td>
        <td>Active</td>
      </tr>

      <tr>
        <td>Charlie Lee</td>
        <td>charlie@example.com</td>
        <td>User</td>
        <td>Inactive</td>
      </tr>
    </tbody>
  </table>
</div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
