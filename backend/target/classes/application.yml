
spring:
  application:
    name: aspm-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}

server:
  port: ${ASPM_SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${ASPM_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
  auth:
    # Local/demo default. Set APP_SEED_DEFAULT_USER=false and provide users through
    # the user-management work before deploying outside the development environment.
    seed-default-user: ${APP_SEED_DEFAULT_USER:true}
    default-email: ${APP_DEFAULT_EMAIL:admin@example.com}
    default-password: ${APP_DEFAULT_PASSWORD:password123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
