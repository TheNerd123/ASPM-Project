spring:
  application:
    name: aspm-backend

server:
  port: ${ASPM_SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${ASPM_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
