
spring:
  application:
    name: aspm-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}

server:
  port: ${ASPM_SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${ASPM_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
