services:
  db:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    image: backend_launch
    ports:
      - 8080:8080
    environment:
      DB_URL: jdbc:postgresql://db:5432/mydb
      DB_USERNAME: postgres
      DB_PASSWORD: localdev
      DB_DDL_AUTO: update
    depends_on:
      - db

volumes:
  postgres-data:
